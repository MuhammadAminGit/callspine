name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m ruff check src tests faultkit
      - run: .venv/bin/python -m pytest -q

  faultkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - name: start server
        run: |
          RETELL_API_KEY=dev-secret VAPI_SECRET=dev-secret CALLSPINE_API_TOKEN=dev-token \
          CALLSPINE_DB=/tmp/ci.db \
            .venv/bin/python -m uvicorn --factory callspine.app:create_app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      # Both providers share one database, which is what the per-provider slot ranges are for.
      - run: .venv/bin/python faultkit/replay.py --provider vapi   --fault all --calls 10
      - run: .venv/bin/python faultkit/replay.py --provider retell --fault all --calls 10
